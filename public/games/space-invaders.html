<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Blaster</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 520px;
      padding: 8px 16px;
      font-size: 13px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px 8px 0 0;
    }
    .hud-label { color: #94a3b8; font-size: 11px; }
    .hud-val { color: #38bdf8; font-weight: bold; }
    #wrap {
      position: relative;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 0 0 8px 8px;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(4px);
    }
    .title { font-size: 26px; font-weight: 800; color: #a855f7; }
    .btn {
      padding: 10px 24px;
      background: #a855f7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #c084fc; }
    .hint { margin-top: 10px; font-size: 11px; color: #64748b; }
    .key { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="hud">
    <div><span class="hud-label">Score: </span><span id="score" class="hud-val">0</span></div>
    <div><span class="hud-label">Lives: </span><span id="lives" class="hud-val">3</span></div>
    <div><span class="hud-label">Wave: </span><span id="wave" class="hud-val">1</span></div>
  </div>

  <div id="wrap">
    <canvas id="c" width="520" height="480"></canvas>
    <div id="overlay" class="overlay">
      <div id="overlay-title" class="title">SPACE BLASTER</div>
      <div id="overlay-msg" style="color: #94a3b8; font-size: 13px;">Defend the galaxy against alien invaders!</div>
      <button id="start-btn" class="btn">LAUNCH MISSION</button>
    </div>
  </div>

  <div class="hint">
    Move: <span class="key">A/D</span> or <span class="key">←/→</span> · Fire: <span class="key">SPACE</span>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const waveEl = document.getElementById('wave');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    let player = { x: 240, y: 440, w: 32, h: 16, speed: 6 };
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];
    let enemyDir = 1;
    let enemySpeed = 1;
    let score = 0;
    let lives = 3;
    let wave = 1;
    let running = false;
    let lastFire = 0;

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function initEnemies() {
      enemies = [];
      const rows = 4;
      const cols = 9;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: 60 + c * 44,
            y: 50 + r * 35,
            w: 24,
            h: 18,
            type: r,
            alive: true
          });
        }
      }
      enemySpeed = 0.8 + wave * 0.2;
    }

    function start() {
      score = 0;
      lives = 3;
      wave = 1;
      player.x = 240;
      bullets = [];
      enemyBullets = [];
      particles = [];
      scoreEl.textContent = '0';
      livesEl.textContent = '3';
      waveEl.textContent = '1';
      initEnemies();
      running = true;
      overlay.style.display = 'none';
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 1,
          color
        });
      }
    }

    function update() {
      if (!running) return;

      // Player move
      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
      player.x = Math.max(10, Math.min(canvas.width - player.w - 10, player.x));

      // Player fire
      if (keys['Space'] && performance.now() - lastFire > 220) {
        bullets.push({ x: player.x + player.w / 2, y: player.y, vy: -8 });
        lastFire = performance.now();
      }

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;
        if (b.y < 0) { bullets.splice(i, 1); continue; }

        // Hit enemy
        for (let e of enemies) {
          if (e.alive && b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            e.alive = false;
            bullets.splice(i, 1);
            score += 20 * (4 - e.type);
            scoreEl.textContent = score;
            createExplosion(e.x + e.w / 2, e.y + e.h / 2, '#c084fc');
            break;
          }
        }
      }

      // Enemy logic
      let edgeReached = false;
      let aliveCount = 0;
      for (let e of enemies) {
        if (!e.alive) continue;
        aliveCount++;
        e.x += enemyDir * enemySpeed;
        if (e.x < 15 || e.x + e.w > canvas.width - 15) {
          edgeReached = true;
        }

        // Alien reached bottom
        if (e.y + e.h >= player.y) {
          return gameOver();
        }

        // Alien shooting
        if (Math.random() < 0.0006 * wave) {
          enemyBullets.push({ x: e.x + e.w / 2, y: e.y + e.h, vy: 4 });
        }
      }

      if (edgeReached) {
        enemyDir *= -1;
        for (let e of enemies) e.y += 12;
      }

      // Check next wave
      if (aliveCount === 0) {
        wave++;
        waveEl.textContent = wave;
        initEnemies();
      }

      // Enemy bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.y += eb.vy;
        if (eb.y > canvas.height) { enemyBullets.splice(i, 1); continue; }

        // Hit player
        if (eb.x > player.x && eb.x < player.x + player.w &&
            eb.y > player.y && eb.y < player.y + player.h) {
          enemyBullets.splice(i, 1);
          lives--;
          livesEl.textContent = lives;
          createExplosion(player.x + player.w / 2, player.y + player.h / 2, '#ef4444');
          if (lives <= 0) return gameOver();
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function gameOver() {
      running = false;
      overlayTitle.textContent = 'MISSION FAILED';
      overlayMsg.textContent = 'Score: ' + score + ' · Wave: ' + wave;
      startBtn.textContent = 'TRY AGAIN';
      overlay.style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Starfield
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      for (let i = 0; i < 40; i++) {
        const sx = (i * 73 + (performance.now() * 0.02)) % canvas.width;
        const sy = (i * 97) % canvas.height;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // Player cannon
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(player.x + player.w / 2, player.y);
      ctx.lineTo(player.x + player.w, player.y + player.h);
      ctx.lineTo(player.x, player.y + player.h);
      ctx.closePath();
      ctx.fill();

      // Bullets
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => ctx.fillRect(b.x - 1.5, b.y, 3, 10));

      ctx.fillStyle = '#ef4444';
      enemyBullets.forEach(eb => ctx.fillRect(eb.x - 1.5, eb.y, 3, 8));

      // Enemies
      const alienColors = ['#f43f5e', '#a855f7', '#06b6d4', '#10b981'];
      enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = alienColors[e.type] || '#fff';
        ctx.fillRect(e.x + 3, e.y, e.w - 6, e.h);
        ctx.fillRect(e.x, e.y + 4, e.w, e.h - 8);
        ctx.fillStyle = '#020617';
        ctx.fillRect(e.x + 5, e.y + 4, 3, 4);
        ctx.fillRect(e.x + e.w - 8, e.y + 4, 3, 4);
      });

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
      ctx.globalAlpha = 1;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', start);
    loop();
  </script>
</body>
</html>
