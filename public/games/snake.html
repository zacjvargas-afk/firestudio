<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      padding: 12px 16px;
      font-size: 14px;
      background: #111827;
      border: 1px solid #1f2937;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
    }
    .hud-item { display: flex; gap: 8px; }
    .hud-label { color: #9ca3af; text-transform: uppercase; font-size: 11px; }
    .hud-val { color: #10b981; font-weight: bold; }
    #canvas-wrap {
      position: relative;
      background: #030712;
      border: 1px solid #1f2937;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    canvas { display: block; image-rendering: pixelated; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
    }
    .title { font-size: 24px; font-weight: 800; color: #10b981; letter-spacing: 2px; }
    .subtitle { font-size: 13px; color: #94a3b8; }
    .btn {
      padding: 10px 24px;
      background: #10b981;
      color: #030712;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #34d399; transform: translateY(-1px); }
    .controls-hint {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      display: flex;
      gap: 12px;
    }
    .key {
      background: #1f2937;
      border: 1px solid #374151;
      padding: 2px 6px;
      border-radius: 4px;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-item">
      <span class="hud-label">Score</span>
      <span id="score" class="hud-val">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">High</span>
      <span id="best" class="hud-val">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Speed</span>
      <span id="speed" class="hud-val">1x</span>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="overlay" class="overlay">
      <div class="title" id="overlay-title">RETRO SNAKE</div>
      <div class="subtitle" id="overlay-msg">Use Arrow keys or WASD to slither</div>
      <button class="btn" id="start-btn">PLAY NOW</button>
    </div>
  </div>

  <div class="controls-hint">
    <span><span class="key">WASD</span> or <span class="key">Arrows</span> Move</span>
    <span><span class="key">SPACE</span> Pause</span>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const speedEl = document.getElementById('speed');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    // Audio synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration = 0.08, type = 'square') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const GRID = 20;
    const TILES = canvas.width / GRID;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 12 };
    let score = 0;
    let best = parseInt(localStorage.getItem('firestudeo_snake_best') || '0', 10);
    bestEl.textContent = best;
    let running = false;
    let paused = false;
    let tickSpeed = 110;
    let lastTick = 0;

    function resetGame() {
      snake = [
        { x: 10, y: 12 },
        { x: 9, y: 12 },
        { x: 8, y: 12 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = '0';
      tickSpeed = 110;
      speedEl.textContent = '1x';
      spawnFood();
      running = true;
      paused = false;
      overlay.style.display = 'none';
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * TILES),
          y: Math.floor(Math.random() * TILES)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function gameOver() {
      running = false;
      beep(150, 0.3, 'sawtooth');
      if (score > best) {
        best = score;
        localStorage.setItem('firestudeo_snake_best', best);
        bestEl.textContent = best;
      }
      overlayTitle.textContent = 'GAME OVER';
      overlayMsg.textContent = 'Final Score: ' + score;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    function update() {
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= TILES || head.y < 0 || head.y >= TILES) {
        return gameOver();
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        beep(520, 0.1, 'sine');
        spawnFood();

        // Speedup
        if (score % 50 === 0 && tickSpeed > 55) {
          tickSpeed -= 8;
          speedEl.textContent = (110 / tickSpeed).toFixed(1) + 'x';
        }
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid subtle lines
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((seg, index) => {
        if (index === 0) {
          ctx.fillStyle = '#10b981';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = index % 2 === 0 ? '#059669' : '#047857';
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
      });
      ctx.shadowBlur = 0;
    }

    function loop(time) {
      if (running && !paused) {
        if (time - lastTick >= tickSpeed) {
          update();
          lastTick = time;
        }
      }
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if ((k === 'arrowup' || k === 'w') && dir.y === 0) nextDir = { x: 0, y: -1 };
      else if ((k === 'arrowdown' || k === 's') && dir.y === 0) nextDir = { x: 0, y: 1 };
      else if ((k === 'arrowleft' || k === 'a') && dir.x === 0) nextDir = { x: -1, y: 0 };
      else if ((k === 'arrowright' || k === 'd') && dir.x === 0) nextDir = { x: 1, y: 0 };
      else if (k === ' ' && running) {
        paused = !paused;
        if (paused) {
          overlayTitle.textContent = 'PAUSED';
          overlayMsg.textContent = 'Press Space or click Resume to continue';
          startBtn.textContent = 'RESUME';
          overlay.style.display = 'flex';
        } else {
          overlay.style.display = 'none';
        }
      }
    });

    startBtn.addEventListener('click', () => {
      if (paused) {
        paused = false;
        overlay.style.display = 'none';
      } else {
        resetGame();
      }
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
