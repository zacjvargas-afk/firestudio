<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    .game-window {
      background: #1e293b;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 8px 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .digit-box {
      font-size: 20px;
      font-weight: 800;
      color: #ef4444;
      background: #020617;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 2px;
    }
    .face-btn {
      font-size: 20px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .face-btn:hover { background: #475569; }
    .grid {
      display: grid;
      grid-template-columns: repeat(10, 32px);
      grid-template-rows: repeat(10, 32px);
      gap: 3px;
      background: #0f172a;
      padding: 6px;
      border-radius: 6px;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #334155;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
      transition: background 0.1s ease;
    }
    .cell:hover:not(.revealed) { background: #475569; }
    .cell.revealed {
      background: #0f172a;
      box-shadow: none;
      cursor: default;
    }
    .cell.mine { background: #dc2626; color: #fff; }
    .cell.flagged { color: #f59e0b; }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #818cf8; }
    .c-5 { color: #fb923c; }
    .c-6 { color: #2dd4bf; }
    .hint { margin-top: 10px; font-size: 11px; color: #64748b; }
    .key { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="game-window">
    <div class="hud">
      <div id="mines-left" class="digit-box">012</div>
      <button id="face" class="face-btn">🙂</button>
      <div id="timer" class="digit-box">000</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="hint">Left Click: Reveal · Right Click or Long Press: Flag</div>

  <script>
    const ROWS = 10;
    const COLS = 10;
    const MINES = 12;

    let grid = [];
    let state = 'READY'; // READY, PLAYING, WON, LOST
    let minesLeft = MINES;
    let timerVal = 0;
    let timerId = null;

    const gridEl = document.getElementById('grid');
    const minesEl = document.getElementById('mines-left');
    const timerEl = document.getElementById('timer');
    const faceEl = document.getElementById('face');

    function init() {
      state = 'READY';
      minesLeft = MINES;
      timerVal = 0;
      clearInterval(timerId);
      timerEl.textContent = '000';
      minesEl.textContent = String(MINES).padStart(3, '0');
      faceEl.textContent = '🙂';

      grid = [];
      gridEl.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
          const cell = {
            r, c,
            mine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el: null
          };
          const div = document.createElement('div');
          div.className = 'cell';
          div.addEventListener('click', () => onLeftClick(cell));
          div.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            onRightClick(cell);
          });
          cell.el = div;
          grid[r][c] = cell;
          gridEl.appendChild(div);
        }
      }
    }

    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if ((r === safeR && c === safeC) || grid[r][c].mine) continue;
        grid[r][c].mine = true;
        planted++;
      }

      // Calculate counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c].mine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr;
              const nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].mine) {
                count++;
              }
            }
          }
          grid[r][c].count = count;
        }
      }
    }

    function onLeftClick(cell) {
      if (state === 'WON' || state === 'LOST' || cell.flagged || cell.revealed) return;

      if (state === 'READY') {
        plantMines(cell.r, cell.c);
        state = 'PLAYING';
        timerId = setInterval(() => {
          timerVal = Math.min(999, timerVal + 1);
          timerEl.textContent = String(timerVal).padStart(3, '0');
        }, 1000);
      }

      if (cell.mine) {
        gameOver(false);
        return;
      }

      reveal(cell);
      checkWin();
    }

    function reveal(cell) {
      if (cell.revealed || cell.flagged) return;
      cell.revealed = true;
      cell.el.classList.add('revealed');

      if (cell.count > 0) {
        cell.el.textContent = cell.count;
        cell.el.classList.add('c-' + cell.count);
      } else {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = cell.r + dr;
            const nc = cell.c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              reveal(grid[nr][nc]);
            }
          }
        }
      }
    }

    function onRightClick(cell) {
      if (state === 'WON' || state === 'LOST' || cell.revealed) return;
      cell.flagged = !cell.flagged;
      if (cell.flagged) {
        cell.el.textContent = '🚩';
        cell.el.classList.add('flagged');
        minesLeft--;
      } else {
        cell.el.textContent = '';
        cell.el.classList.remove('flagged');
        minesLeft++;
      }
      minesEl.textContent = String(minesLeft).padStart(3, '0');
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!grid[r][c].mine && !grid[r][c].revealed) unrevealedSafe++;
        }
      }
      if (unrevealedSafe === 0) gameOver(true);
    }

    function gameOver(won) {
      state = won ? 'WON' : 'LOST';
      clearInterval(timerId);
      faceEl.textContent = won ? '😎' : '😵';

      // Reveal all mines
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = grid[r][c];
          if (cell.mine) {
            cell.el.classList.add('mine');
            cell.el.textContent = '💣';
          }
        }
      }
    }

    faceEl.addEventListener('click', init);
    init();
  </script>
</body>
</html>
